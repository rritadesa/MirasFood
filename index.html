<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MirasFood - Mirandiba PE</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            🍴 Miras<span>Food</span>
        </div>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#categorias">Categorias</a>
            <a href="#lugares">Lugares</a>
        </nav>
    </header>


    <main>

        <section id="inicio"
                 class="hero">

            <span>📍 Mirandiba - PE</span>

            <h1>
                Descubra onde
                <strong>comer bem.</strong>
            </h1>

            <p>
                Encontre restaurantes, lanchonetes,
                padarias, pizzarias e muito mais.
            </p>

            <div class="search">
                <input
                    id="search"
                    type="text"
                    placeholder="O que você procura?"
                >

                <button id="buscar">
                    Buscar
                </button>
            </div>

        </section>


        <section id="categorias"
                 class="section">

            <h2>Categorias</h2>

            <div class="categorias">

                <button data-category="Restaurante">
                    🍽️
                    <b>Restaurantes</b>
                </button>

                <button data-category="Lanchonete">
                    🍔
                    <b>Lanchonetes</b>
                </button>

                <button data-category="Padaria">
                    🥖
                    <b>Padarias</b>
                </button>

                <button data-category="Pizzaria">
                    🍕
                    <b>Pizzarias</b>
                </button>

                <button data-category="Sorveteria">
                    🍦
                    <b>Sorveterias</b>
                </button>

            </div>

        </section>


        <section id="lugares"
                 class="section">

            <h2>Lugares para comer</h2>

            <div id="lugares-lista"
                 class="lugares">

            </div>

        </section>

    </main>


    <footer>

        <strong>🍴 MirasFood</strong>

        <p>
            Descubra sabores de Mirandiba - PE.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
